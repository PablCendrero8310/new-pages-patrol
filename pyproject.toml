[project]
name = "autodestroychecker"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Pablo", email = "pabloagujeronegro2013@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "aiohttp>=3.14.3",
    "mwparserfromhell>=0.5.2",
    "numpy>=2.5.2",
    "onnxruntime>=1.28.0",
    "optimum[onnxruntime]==2.1.0",
    "pywikibot>=11.6.0",
    "requests>=2.20.1",
    "transformers>=4.56,<4.57",
]

[project.scripts]
autodestroychecker = "autodestroychecker:main"

[build-system]
requires = ["uv_build>=0.12.1,<0.13.0"]
build-backend = "uv_build"
